name: Deploy MetaNest Frontend

on:
  push:
    branches:
      - devops

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /root/MetaNest

            git fetch origin
            git checkout devops
            git pull origin devops

            docker stop metanest-frontend || true
            docker rm metanest-frontend || true

            docker build -t metanest-frontend:1.0.0 .

            docker run -d \
              --name metanest-frontend \
              --restart unless-stopped \
              -p 80:80 \
              metanest-frontend:1.0.0
